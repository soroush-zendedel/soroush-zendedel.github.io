# ==========================================
# GENERAL SETTINGS
# ==========================================

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  disable_env_credential_login: false


# ==========================================
# ROUTER SETTINGS
# ==========================================

router_settings:
  redis_host: redis
  redis_port: 6379

  routing_strategy: simple-shuffle
  enable_weighted_failover: true
  max_fallbacks: 17


# ==========================================
# LITELLM SETTINGS
# ==========================================

litellm_settings:
  cache: false
  cache_params:
    type: redis
    host: redis
    port: 6379